[project]
name = "kinetix-ai"
version = "1.1.0"
description = "KinetixAI (FlowVids-AI) Polyglot Automated Video Production, Desktop Studio & MCP Server (Clean Architecture + GitHub Spec Kit)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "yt-dlp>=2024.10.0",
    "faster-whisper>=1.0.3",
    "ffmpeg-python>=0.2.0",
    "httpx>=0.27.0",
    "streamlit>=1.39.0",
    "mcp>=1.2.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
