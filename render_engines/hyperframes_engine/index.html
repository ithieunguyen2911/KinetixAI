<!DOCTYPE html>
<html
  lang="en"
  data-composition-variables='[{"id":"projectTitle","type":"string","label":"Project Title","default":"Kinetix Studio"}]'
>
  <head>
    <meta charset="UTF-8" />
    <title>HyperFrames Root Composition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1280"
      data-height="720"
    >
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-track-kind="captions"
        data-start="0"
        data-duration="6"
        data-track-index="1"
        data-width="1280"
        data-height="720"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      if (typeof gsap !== "undefined") {
        window.__timelines["main"] = gsap.timeline({ paused: true });
      }
    </script>
  </body>
</html>
